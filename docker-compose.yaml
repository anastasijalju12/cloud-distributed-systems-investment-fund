services:
  authentication-database: # MySQL, stores only users
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fund
    healthcheck: # checks is database ready to accept connections, not just started
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo: # non relational database, stores assets
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  redis: # temporary storage for orders waiting for decision
    image: redis:7

  authentication:
    build: ./authentication
    image: investment-fund-authentication:k8s # same tag kubernetes manifest expects
    ports:
      - "5000:5000"
    environment: # service name works as host inside docker network
      DATABASE_URL: authentication-database
      DATABASE_NAME: fund
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      JWT_SECRET_KEY: JWT_SECRET_DEV_KEY
    depends_on:
      authentication-database:
        condition: service_healthy

  employee:
    build: ./employee
    image: investment-fund-employee:k8s
    ports:
      - "5001:5001"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: root
      MONGO_PASSWORD: example
      MONGO_DATABASE: investment_fund
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: JWT_SECRET_DEV_KEY # must be same in all 3 services
    depends_on:
      - mongo
      - redis

  director: # services name
    build: ./director
    image: investment-fund-director:k8s
    ports:
      - "5002:5002"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: root
      MONGO_PASSWORD: example
      MONGO_DATABASE: investment_fund
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: JWT_SECRET_DEV_KEY
      ETHEREUM_URL: http://ganache:8545
    depends_on:
      - mongo
      - redis
      - ganache

  ganache:
    image: trufflesuite/ganache-cli
    ports:
      - "8545:8545"